<button class="chat-fab" type="button" (click)="toggleChat()">
  💬
</button>

<div class="chat-panel" *ngIf="isOpen">
  <div class="chat-header">
    <div>
      <h3>Parks OT Assistant</h3>
      <p>Consulta OTs por número, empresa o activo</p>
    </div>

    <div class="chat-header-actions">
      <button class="chat-reset" type="button" (click)="resetConversation()">
        Reiniciar
      </button>

      <button class="chat-close" type="button" (click)="toggleChat()">
        ✕
      </button>
    </div>
  </div>

  <div class="chat-body" #chatContainer>
    <div
      *ngFor="let message of messages"
      class="chat-message"
      [ngClass]="message.role"
    >
      {{ message.text }}
    </div>
  </div>

  <div class="chat-footer">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keydown.enter)="sendMessage()"
      placeholder="Escribí OT-001, Aurora I o Río Norte..."
    />

    <button type="button" (click)="sendMessage()">
      Enviar
    </button>
  </div>
</div>
